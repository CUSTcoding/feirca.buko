spring.application.name=feirca-buko_api
# JWT config
jwt.secret=${JWT_SECRET:default-jwt-secret-key-default-jwt-secret-key}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

spring.datasource.url=jdbc:h2:mem:feircadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect